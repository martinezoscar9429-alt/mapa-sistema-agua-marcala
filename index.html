<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de agua - Marcala, La Paz</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
  #map { height: 100%; width: 100%; }
  .panel {
    position: absolute; z-index: 1000; top: 14px; left: 14px;
    width: 315px; background: rgba(255,255,255,.96);
    border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 3px 16px rgba(0,0,0,.22); line-height: 1.35;
  }
  .panel h1 { font-size: 18px; margin: 0 0 5px; }
  .panel p { font-size: 12px; margin: 5px 0; color: #444; }
  .legend { margin-top: 10px; font-size: 12px; }
  .legend-row { display:flex; gap:8px; align-items:center; margin:4px 0; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .square { width:12px; height:12px; display:inline-block; }
  .line { width:30px; height:0; border-top:4px solid; display:inline-block; }
  .badge { padding:2px 6px; border-radius:10px; background:#f1f3f5; font-size:10px; }
  .leaflet-tooltip.label { font-weight:600; background:rgba(255,255,255,.88); border:0;
    box-shadow:none; color:#1b1f23; }
  .arrow-marker { font-size: 22px; font-weight: bold; text-shadow: 0 0 3px white; }
  @media (max-width: 700px) {
    .panel { width: calc(100% - 56px); top:10px; left:10px; padding:10px 12px; }
    .panel p { display:none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Sistema de agua · Marcala</h1>
  <p>Visualización demostrativa de la red del croquis. Las coordenadas representan centros de localidades o posiciones aproximadas; no sustituyen un levantamiento GPS de la infraestructura.</p>
  <div class="legend">
    <div class="legend-row"><span class="dot" style="background:#1565c0"></span> Obra toma</div>
    <div class="legend-row"><span class="square" style="background:#c62828"></span> Cámara derivadora</div>
    <div class="legend-row"><span class="dot" style="background:#2e7d32"></span> Tanque</div>
    <div class="legend-row"><span class="line" style="border-color:#1565c0"></span> Línea principal</div>
    <div class="legend-row"><span class="line" style="border-color:#757575;border-top-style:dashed"></span> Ramal</div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const points = [{"type": "Feature", "properties": {"id": "OT01", "tipo": "Obra toma", "nombre": "Obra toma", "precision": "Aproximada para demostración"}, "geometry": {"type": "Point", "coordinates": [-88.028, 14.105]}}, {"type": "Feature", "properties": {"id": "CD01", "tipo": "Cámara derivadora", "nombre": "Musula", "precision": "Referencia geográfica pública"}, "geometry": {"type": "Point", "coordinates": [-88.03333, 14.11667]}}, {"type": "Feature", "properties": {"id": "CD02", "tipo": "Cámara derivadora", "nombre": "Ocotal Oscuro", "precision": "Referencia geográfica pública"}, "geometry": {"type": "Point", "coordinates": [-88.03333, 14.15]}}, {"type": "Feature", "properties": {"id": "CD03", "tipo": "Cámara derivadora", "nombre": "Cruz de Lajas", "precision": "Aproximada para demostración"}, "geometry": {"type": "Point", "coordinates": [-88.0385, 14.1667]}}, {"type": "Feature", "properties": {"id": "CD04", "tipo": "Cámara derivadora", "nombre": "El Pelón", "precision": "Aproximada para demostración"}, "geometry": {"type": "Point", "coordinates": [-88.052, 14.1844]}}, {"type": "Feature", "properties": {"id": "TQ01", "tipo": "Tanque", "nombre": "sisiguara", "precision": "Aproximada para demostración"}, "geometry": {"type": "Point", "coordinates": [-88.046, 14.1085]}}, {"type": "Feature", "properties": {"id": "TQ02", "tipo": "Tanque", "nombre": "Chusmuy", "precision": "Aproximada para demostración"}, "geometry": {"type": "Point", "coordinates": [-88.046, 14.1815]}}, {"type": "Feature", "properties": {"id": "TQ03", "tipo": "Tanque", "nombre": "El Carmen", "precision": "Referencia geográfica pública"}, "geometry": {"type": "Point", "coordinates": [-88.02789, 14.18542]}}, {"type": "Feature", "properties": {"id": "TQ04", "tipo": "Tanque", "nombre": "La Chorrera", "precision": "Aproximada para demostración"}, "geometry": {"type": "Point", "coordinates": [-88.02998, 14.19814]}}, {"type": "Feature", "properties": {"id": "TQ05", "tipo": "Tanque", "nombre": "La Estanzuela", "precision": "Referencia geográfica pública"}, "geometry": {"type": "Point", "coordinates": [-88.05, 14.21667]}}, {"type": "Feature", "properties": {"id": "TQ06", "tipo": "Tanque", "nombre": "El Pelón", "precision": "Referencia geográfica pública"}, "geometry": {"type": "Point", "coordinates": [-88.05, 14.18333]}}, {"type": "Feature", "properties": {"id": "TQ07", "tipo": "Tanque", "nombre": "Queseras", "precision": "Referencia geográfica pública"}, "geometry": {"type": "Point", "coordinates": [-88.08333, 14.2]}}, {"type": "Feature", "properties": {"id": "TQ08", "tipo": "Tanque", "nombre": "Santa Rosita", "precision": "Aproximada para demostración"}, "geometry": {"type": "Point", "coordinates": [-88.05507, 14.24441]}}];
const lines = [{"type": "Feature", "properties": {"id": "TR01", "desde": "OT01", "hasta": "CD01", "tipo": "Línea principal"}, "geometry": {"type": "LineString", "coordinates": [[-88.028, 14.105], [-88.03333, 14.11667]]}}, {"type": "Feature", "properties": {"id": "TR02", "desde": "CD01", "hasta": "CD02", "tipo": "Línea principal"}, "geometry": {"type": "LineString", "coordinates": [[-88.03333, 14.11667], [-88.03333, 14.15]]}}, {"type": "Feature", "properties": {"id": "TR03", "desde": "CD01", "hasta": "TQ01", "tipo": "Ramal"}, "geometry": {"type": "LineString", "coordinates": [[-88.03333, 14.11667], [-88.046, 14.1085]]}}, {"type": "Feature", "properties": {"id": "TR04", "desde": "CD02", "hasta": "CD03", "tipo": "Línea principal"}, "geometry": {"type": "LineString", "coordinates": [[-88.03333, 14.15], [-88.0385, 14.1667]]}}, {"type": "Feature", "properties": {"id": "TR05", "desde": "CD02", "hasta": "TQ02", "tipo": "Ramal"}, "geometry": {"type": "LineString", "coordinates": [[-88.03333, 14.15], [-88.046, 14.1815]]}}, {"type": "Feature", "properties": {"id": "TR06", "desde": "CD02", "hasta": "TQ03", "tipo": "Ramal"}, "geometry": {"type": "LineString", "coordinates": [[-88.03333, 14.15], [-88.02789, 14.18542]]}}, {"type": "Feature", "properties": {"id": "TR07", "desde": "CD03", "hasta": "TQ04", "tipo": "Ramal"}, "geometry": {"type": "LineString", "coordinates": [[-88.0385, 14.1667], [-88.02998, 14.19814]]}}, {"type": "Feature", "properties": {"id": "TR08", "desde": "CD03", "hasta": "TQ05", "tipo": "Ramal"}, "geometry": {"type": "LineString", "coordinates": [[-88.0385, 14.1667], [-88.05, 14.21667]]}}, {"type": "Feature", "properties": {"id": "TR09-demo", "desde": "CD03", "hasta": "CD04", "tipo": "Línea principal"}, "geometry": {"type": "LineString", "coordinates": [[-88.0385, 14.1667], [-88.052, 14.1844]]}}, {"type": "Feature", "properties": {"id": "TR10", "desde": "CD04", "hasta": "TQ06", "tipo": "Ramal"}, "geometry": {"type": "LineString", "coordinates": [[-88.052, 14.1844], [-88.05, 14.18333]]}}, {"type": "Feature", "properties": {"id": "TR11", "desde": "CD04", "hasta": "TQ07", "tipo": "Ramal"}, "geometry": {"type": "LineString", "coordinates": [[-88.052, 14.1844], [-88.08333, 14.2]]}}, {"type": "Feature", "properties": {"id": "TR12", "desde": "CD04", "hasta": "TQ08", "tipo": "Ramal"}, "geometry": {"type": "LineString", "coordinates": [[-88.052, 14.1844], [-88.05507, 14.24441]]}}];

const map = L.map('map', { zoomControl: true });
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const pointLayer = L.layerGroup().addTo(map);
const mainLayer = L.layerGroup().addTo(map);
const branchLayer = L.layerGroup().addTo(map);
const arrowLayer = L.layerGroup().addTo(map);

function markerStyle(tipo) {
  if (tipo === 'Obra toma') return {radius:8, color:'#0d47a1', fillColor:'#1565c0', fillOpacity:1, weight:2};
  if (tipo === 'Cámara derivadora') return {radius:8, color:'#8e0000', fillColor:'#c62828', fillOpacity:1, weight:2};
  return {radius:7, color:'#1b5e20', fillColor:'#2e7d32', fillOpacity:1, weight:2};
}

const bounds = [];
points.forEach(f => {
  const [lon, lat] = f.geometry.coordinates;
  bounds.push([lat, lon]);
  const p = f.properties;
  const m = L.circleMarker([lat, lon], markerStyle(p.tipo)).addTo(pointLayer);
  m.bindTooltip(`${p.nombre}`, {className:'label', direction:'top', offset:[0,-6]});
  m.bindPopup(`
    <b>${p.nombre}</b><br>
    ${p.tipo}<br>
    <span class="badge">${p.id}</span><br><br>
    <b>Latitud:</b> ${lat.toFixed(5)}<br>
    <b>Longitud:</b> ${lon.toFixed(5)}<br>
    <b>Referencia:</b> ${p.precision}
  `);
});

function bearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const phi1=toRad(lat1), phi2=toRad(lat2);
  const dl=toRad(lon2-lon1);
  const y=Math.sin(dl)*Math.cos(phi2);
  const x=Math.cos(phi1)*Math.sin(phi2)-Math.sin(phi1)*Math.cos(phi2)*Math.cos(dl);
  return (toDeg(Math.atan2(y,x))+360)%360;
}

lines.forEach(f => {
  const [[lon1,lat1],[lon2,lat2]] = f.geometry.coordinates;
  const main = f.properties.tipo === 'Línea principal';
  const style = main
    ? {color:'#1565c0', weight:5, opacity:.85}
    : {color:'#757575', weight:3, opacity:.8, dashArray:'8 7'};
  const layer = L.polyline([[lat1,lon1],[lat2,lon2]], style)
    .bindPopup(`<b>${f.properties.id}</b><br>${f.properties.tipo}<br>${f.properties.desde} → ${f.properties.hasta}`);
  layer.addTo(main ? mainLayer : branchLayer);

  const midLat=(lat1+lat2)/2, midLon=(lon1+lon2)/2;
  const ang=bearing(lat1,lon1,lat2,lon2);
  const icon=L.divIcon({
    className:'',
    html:`<div class="arrow-marker" style="transform:rotate(${ang}deg); color:${main ? '#1565c0' : '#555'}">➤</div>`,
    iconSize:[24,24], iconAnchor:[12,12]
  });
  L.marker([midLat,midLon], {icon, interactive:false}).addTo(arrowLayer);
});

L.control.layers(
  {'OpenStreetMap': osm},
  {
    'Infraestructura': pointLayer,
    'Línea principal': mainLayer,
    'Ramales': branchLayer,
    'Flechas de flujo': arrowLayer
  },
  {collapsed:false}
).addTo(map);

map.fitBounds(bounds, {padding:[40,40]});
L.control.scale({imperial:false}).addTo(map);
</script>
</body>
</html>
